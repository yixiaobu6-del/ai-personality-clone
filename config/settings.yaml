# AI思维克隆器配置文件

# 分析配置
analysis:
  min_samples: 100
  top_keywords_count: 30
  feature_dimensions: 50
  stopwords:
    - 的
    - 了
    - 是
    - 在
    - 我
    - 有
    - 和
    - 就
    - 不
    - 人
    - 都
    - 一
    - 一个
    - 上
    - 也
    - 很
    - 到
    - 说
    - 要
    - 去

# 生成配置
generation:
  model_type: gpt-4
  temperature: 0.7
  max_tokens: 2000
  include_examples: true
  example_count: 5

# 输出配置
output:
  format: json
  include_metadata: true
  save_path: ./output

# 验证配置
validation:
  similarity_threshold: 0.7
  test_sample_count: 20